openapi: 3.1.0
info:
  title: Employee Management System API
  description: A RESTful API for managing employee records, supporting create, read, update, and delete operations.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  /api/employee:
    post:
      summary: Create a new employee
      operationId: createEmployee
      tags:
        - Employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DtoEmployee'
      responses:
        '201':
          description: Employee created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DtoEmployee'
    get:
      summary: Retrieve all employees
      operationId: findAllEmployees
      tags:
        - Employee
      responses:
        '200':
          description: List of all employees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DtoEmployee'

  /api/employee/{id}:
    get:
      summary: Retrieve an employee by ID
      operationId: findEmployeeById
      tags:
        - Employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Unique integer identifier of the employee
      responses:
        '200':
          description: Employee found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DtoEmployee'
        '404':
          description: Employee not found for the given ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update an existing employee by ID
      operationId: updateEmployee
      tags:
        - Employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Unique integer identifier of the employee to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DtoEmployee'
      responses:
        '200':
          description: Employee updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DtoEmployee'
        '404':
          description: Employee not found for the given ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete an employee by ID
      operationId: deleteEmployee
      tags:
        - Employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Unique integer identifier of the employee to delete
      responses:
        '200':
          description: Employee deleted successfully
          content:
            application/json:
              schema:
                type: string
                example: This Employee is Deleted successfully
        '404':
          description: Employee not found for the given ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    DtoEmployee:
      type: object
      required:
        - id
        - firstname
        - email
      properties:
        id:
          type: integer
          description: Unique identifier for the employee
        firstname:
          type: string
          description: First name of the employee (non-nullable)
        lastname:
          type: string
          description: Last name of the employee
        email:
          type: string
          description: Email address of the employee (non-nullable)

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          description: Description of the error