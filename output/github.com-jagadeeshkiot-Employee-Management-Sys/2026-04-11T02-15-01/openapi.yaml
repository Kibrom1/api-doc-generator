openapi: 3.1.0
info:
  title: Employee Management System API
  description: A REST API for managing employee records, supporting create, read, update, and delete operations.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  /api/employee:
    post:
      tags:
        - Employee
      summary: Create a new employee
      operationId: createEmployee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DtoEmployee'
      responses:
        '201':
          description: Employee created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DtoEmployee'

    get:
      tags:
        - Employee
      summary: Retrieve all employees
      operationId: findAllEmployee
      responses:
        '200':
          description: List of all employees retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DtoEmployee'

  /api/employee/{id}:
    get:
      tags:
        - Employee
      summary: Retrieve an employee by ID
      operationId: findById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: The unique identifier of the employee
      responses:
        '200':
          description: Employee found and returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DtoEmployee'
        '404':
          description: Employee not found for the given ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - Employee
      summary: Update an existing employee
      operationId: updateEmployee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: The unique identifier of the employee to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DtoEmployee'
      responses:
        '200':
          description: Employee updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DtoEmployee'
        '404':
          description: Employee not found for the given ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Employee
      summary: Delete an employee by ID
      operationId: deleteEmployee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: The unique identifier of the employee to delete
      responses:
        '200':
          description: Employee deleted successfully
          content:
            application/json:
              schema:
                type: string
                example: This Employee is Deleted successfully
        '404':
          description: Employee not found for the given ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    DtoEmployee:
      type: object
      properties:
        id:
          type: integer
          description: The unique identifier of the employee
        firstname:
          type: string
          description: First name of the employee
          nullable: false
        lastname:
          type: string
          description: Last name of the employee
        email:
          type: string
          description: Email address of the employee
          nullable: false
      required:
        - firstname
        - email

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          description: Error message describing the issue