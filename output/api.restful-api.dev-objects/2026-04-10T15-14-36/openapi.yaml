openapi: 3.1.0
info:
  title: Restful API Dev - Objects API
  description: >
    A simple RESTful API for managing objects (gadgets/devices). Provides
    CRUD operations on a collection of objects, each identified by a string ID
    and carrying a flexible key-value data payload.
  version: 1.0.0
  contact:
    url: https://api.restful-api.dev

servers:
  - url: https://api.restful-api.dev
    description: Production server

paths:
  /objects:
    get:
      operationId: listObjects
      summary: List all objects
      description: >
        Returns an array of all objects currently stored in the system.
        Each object has an `id`, a `name`, and an optional `data` payload
        that is a free-form key/value map (keys and value types vary per object).
      tags:
        - Objects
      parameters:
        - name: id
          in: query
          required: false
          description: >
            Filter results by one or more specific object IDs.
            Provide the parameter multiple times to filter by multiple IDs
            (e.g., `?id=3&id=5&id=10`).
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          example: ["3", "5", "10"]
      responses:
        "200":
          description: A JSON array of all objects.
          headers:
            Content-Type:
              schema:
                type: string
                example: application/json;charset=UTF-8
            Cache-Control:
              schema:
                type: string
                example: no-cache, no-store, max-age=0, must-revalidate
            X-Content-Type-Options:
              schema:
                type: string
                example: nosniff
            X-XSS-Protection:
              schema:
                type: string
                example: 1; mode=block
            X-Frame-Options:
              schema:
                type: string
                example: DENY
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Object"
              examples:
                fullList:
                  summary: Full list of objects
                  value:
                    - id: "1"
                      name: "Google Pixel 6 Pro"
                      data:
                        color: "Cloudy White"
                        capacity: "128 GB"
                    - id: "2"
                      name: "Apple iPhone 12 Mini, 256GB, Blue"
                      data: null
                    - id: "3"
                      name: "Apple iPhone 12 Pro Max"
                      data:
                        color: "Cloudy White"
                        "capacity GB": 512
                    - id: "7"
                      name: "Apple MacBook Pro 16"
                      data:
                        year: 2019
                        price: 1849.99
                        "CPU model": "Intel Core i9"
                        "Hard disk size": "1 TB"
        "400":
          description: Bad request — invalid query parameter(s).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      operationId: createObject
      summary: Create a new object
      description: >
        Creates a new object with the provided `name` and optional `data` payload.
        The server assigns and returns a unique string `id`.
      tags:
        - Objects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObjectInput"
            examples:
              newDevice:
                summary: Create a new laptop object
                value:
                  name: "Apple MacBook Pro 16"
                  data:
                    year: 2023
                    price: 2399.99
                    "CPU model": "Apple M2 Pro"
                    "Hard disk size": "512 GB"
      responses:
        "200":
          description: The newly created object, including its server-assigned `id`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Object"
              examples:
                createdObject:
                  summary: Newly created object
                  value:
                    id: "ff808181932badb60195c3f7741c46b2"
                    name: "Apple MacBook Pro 16"
                    createdAt: "2026-04-10T15:13:22.123+00:00"
                    data:
                      year: 2023
                      price: 2399.99
                      "CPU model": "Apple M2 Pro"
                      "Hard disk size": "512 GB"
        "400":
          description: Bad request — missing required fields or invalid body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /objects/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The unique string identifier of the object.
        schema:
          type: string
        example: "7"

    get:
      operationId: getObject
      summary: Retrieve a single object by ID
      description: >
        Returns a single object identified by its `id` path parameter.
      tags:
        - Objects
      responses:
        "200":
          description: The requested object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Object"
              examples:
                singleObject:
                  summary: A MacBook Pro object
                  value:
                    id: "7"
                    name: "Apple MacBook Pro 16"
                    data:
                      year: 2019
                      price: 1849.99
                      "CPU model": "Intel Core i9"
                      "Hard disk size": "1 TB"
        "404":
          description: Object not found for the given ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notFound:
                  value:
                    error: "Oject with id=99 was not found."
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      operationId: replaceObject
      summary: Replace an object (full update)
      description: >
        Fully replaces the object identified by `id` with the provided data.
        All fields are overwritten.
      tags:
        - Objects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObjectInput"
            examples:
              replaceObject:
                summary: Replace an object
                value:
                  name: "Apple MacBook Pro 16"
                  data:
                    year: 2020
                    price: 2049.99
                    "CPU model": "Intel Core i9"
                    "Hard disk size": "2 TB"
      responses:
        "200":
          description: The updated object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Object"
        "400":
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateObject
      summary: Partially update an object
      description: >
        Partially updates the object identified by `id`. Only provided fields
        are updated; omitted fields retain their existing values.
      tags:
        - Objects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObjectPatchInput"
            examples:
              patchObject:
                summary: Update just the name
                value:
                  name: "Apple MacBook Pro 16 (Updated)"
      responses:
        "200":
          description: The patched object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Object"
        "400":
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteObject
      summary: Delete an object
      description: >
        Permanently deletes the object identified by `id`.
      tags:
        - Objects
      responses:
        "200":
          description: Confirmation message that the object was deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
              examples:
                deleted:
                  value:
                    message: "Object with id = 7 has been deleted."
        "404":
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    ObjectData:
      type: object
      nullable: true
      description: >
        A free-form key/value map carrying device-specific attributes.
        Keys and value types are not standardized and vary per object.
        Common keys observed include: color, capacity, price, generation,
        year, CPU model, Hard disk size, Screen size, Strap Colour, Case Size,
        Color, Description, Generation, Price, Capacity.
      additionalProperties:
        oneOf:
          - type: string
          - type: number
          - type: boolean
          - type: "null"
      example:
        color: "Cloudy White"
        capacity: "128 GB"
        price: 389.99
        year: 2019

    Object:
      type: object
      description: Represents a stored object (typically a consumer electronics device).
      required:
        - id
        - name
      properties:
        id:
          type: string
          description: >
            Unique identifier for the object. Assigned by the server on creation.
            May be a short numeric string (e.g., "1") or a UUID-like hex string
            for user-created objects.
          example: "7"
        name:
          type: string
          description: Human-readable name for the object.
          minLength: 1
          example: "Apple MacBook Pro 16"
        data:
          $ref: "#/components/schemas/ObjectData"
        createdAt:
          type: string
          format: date-time
          description: >
            ISO 8601 timestamp of when the object was created.
            Returned only for newly created objects (POST response).
          example: "2026-04-10T15:13:22.123+00:00"
        updatedAt:
          type: string
          format: date-time
          description: >
            ISO 8601 timestamp of when the object was last updated.
            Returned only in PUT/PATCH responses.
          example: "2026-04-10T16:00:00.000+00:00"

    ObjectInput:
      type: object
      description: Payload used when creating or fully replacing an object.
      required:
        - name
      properties:
        name:
          type: string
          description: Human-readable name for the object.
          minLength: 1
          example: "Apple MacBook Pro 16"
        data:
          $ref: "#/components/schemas/ObjectData"

    ObjectPatchInput:
      type: object
      description: Payload used for partial updates. All fields are optional.
      properties:
        name:
          type: string
          description: Updated name for the object.
          minLength: 1
          example: "Apple MacBook Pro 16 (Refurbished)"
        data:
          $ref: "#/components/schemas/ObjectData"

    DeleteResponse:
      type: object
      description: Confirmation response returned after a successful deletion.
      properties:
        message:
          type: string
          description: A human-readable confirmation message.
          example: "Object with id = 7 has been deleted."

    ErrorResponse:
      type: object
      description: Standard error response body.
      properties:
        error:
          type: string
          description: A human-readable description of the error.
          example: "Oject with id=99 was not found."