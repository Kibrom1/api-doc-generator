openapi: 3.1.0
info:
  title: Items API
  version: 1.0.0
  description: API for retrieving item data by ID with standard response formatting.
paths:
  /items/{item_id}:
    get:
      summary: Retrieve an item by ID
      operationId: read_item
      tags:
        - Items
      parameters:
        - name: item_id
          in: path
          required: true
          description: The unique identifier of the item. Must be a positive integer less than 10000.
          schema:
            type: integer
            minimum: 1
            maximum: 9999
      responses:
        '200':
          description: Item retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  payload:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 42
                      status:
                        type: string
                        example: active
                  metadata:
                    type: object
                    properties:
                      version:
                        type: string
                        example: '1.0'
        '400':
          description: Bad request due to invalid item ID.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Invalid item ID format
components:
  securitySchemes: {}